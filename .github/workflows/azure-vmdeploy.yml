name: Build and Deploy to Azure VM

on:
  push:
    branches:
      - develop # ajusta si usas otra rama para hacer deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'  # usa la versión de Node.js deseada

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      # Copiar los archivos generados y el código del servidor a la VM usando SCP
      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}  # opcional si usas el puerto 22 por defecto
          source: "."
          target: "/home/${{ secrets.VM_USERNAME }}/form-app"  # ajusta si usas otra ruta

      # Ejecutar comandos remotos vía SSH para instalar dependencias y reiniciar la app
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            cd ~/form-app
            npm install
            pm2 restart app || pm2 start server.js --name app
